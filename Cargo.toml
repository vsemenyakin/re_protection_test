[package]
name = "re_protection_test"
version = "0.1.0"
edition = "2024"

# Make `crypt` a workspace member, not just a path dependency, so that
# `cargo run -p crypt --bin seal` can select it by name.
[workspace]
members = [".", "crates/crypt"]

[dependencies]
crypt = { path = "crates/crypt" }

[features]
default = ["introspection"]
# Layer 0.1 / Layer 1: the single source of human-readable name-strings -- verbose
# diagnostics, the full dev CLI, anything that maps the program's semantics. The
# `ship` build turns this OFF (`--no-default-features`), so those strings never
# enter the binary.
introspection = []
# Layer 5: runtime anti-tamper, self-integrity decode-key binding, and message
# redaction. `ship`-only.
anti-tamper = ["crypt/anti-tamper", "crypt/redact"]

# Layer 0.1: the shipped build profile.
[profile.ship]
inherits = "release"
strip = "symbols"
panic = "abort"
lto = true
codegen-units = 1
opt-level = 3
